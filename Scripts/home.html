<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lucent</title>
<!-- The tab takes its icon from here like it would from any site, rather than the
     host reaching in to set one for its own page. Served as data: because that is
     all this page's policy below permits. -->
<link rel="icon" type="image/png" href="__LUCENT_ICON__">
<style>
  /* The chrome's palette, one step darker in the background. Matching the chrome
     exactly made the bookmarks bar bleed straight into the page, with nothing to
     say where the browser stopped and the page began -- a real site is a shade of
     its own, and this page should be too. */
  :root {
    --bg: #0B0B0E;
    --field: #26262D;
    --tile: #1D1D22;
    --tile-hover: #2C2C34;
    --fg: #E8E8EC;
    --dim: #8A8A95;
    --accent: #7C5CD6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body { display: flex; justify-content: center; }

  main { width: 100%; max-width: 720px; padding: 11vh 24px 60px; }

  /* The arrival. Everything comes in on the same short rise, staggered down the page
     so the eye is led from the mark to the search field instead of the whole layout
     appearing at once. Resting values live on the elements themselves and the
     animations only travel towards them, so switching the movement off leaves a
     correct page rather than an invisible one. */
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  /* The mark is a swirl, so it turns into place rather than merely fading. */
  @keyframes mark-in {
    from { opacity: 0; transform: translateY(14px) scale(.84) rotate(-14deg); }
    to   { opacity: 1; transform: none; }
  }

  /* One pass of the highlight across the wordmark as it lands, then it stays put. */
  @keyframes sheen {
    from { background-position: 0 0; }
    to   { background-position: 100% 0; }
  }

  /* Slow and shallow on purpose: this should read as the logo being lit, not as
     something on the page blinking for attention. */
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 3px 16px rgba(96, 132, 255, .20)); }
    50%      { filter: drop-shadow(0 3px 28px rgba(140, 116, 246, .34)); }
  }

  .hero { margin: 0 0 30px; text-align: center; }

  .mark {
    display: block; margin: 0 auto 15px;
    width: 84px; height: 84px;
    /* Follows the artwork's own alpha, so the glow traces the crescents rather
       than sitting behind a square. */
    filter: drop-shadow(0 3px 16px rgba(96, 132, 255, .20));
    animation: mark-in .7s cubic-bezier(.2,.9,.3,1) both,
               breathe 7s 1.1s ease-in-out infinite;
  }

  h1 {
    margin: 0;
    font-size: 34px; font-weight: 600; letter-spacing: -0.2px;
    /* Taken from the logo above it, so the name reads as part of the mark. The white
       stop is the highlight the sheen sweeps through; at rest the window sits past
       it, on the blue-to-violet end. */
    background-image: linear-gradient(100deg,
      #79CBFF 0%, #FFFFFF 22%, #8FB0FF 46%, #B48CF5 74%, #7C5CD6 100%);
    background-size: 220% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: rise .6s .1s cubic-bezier(.2,.8,.25,1) both,
               sheen 1.5s .3s cubic-bezier(.35,0,.2,1) both;
  }

  form { position: relative; margin: 0 0 46px;
         animation: rise .6s .2s cubic-bezier(.2,.8,.25,1) both; }

  input {
    width: 100%; height: 48px;
    padding: 0 46px 0 20px;
    border: 1px solid transparent; border-radius: 24px;
    background: var(--field); color: var(--fg);
    font-size: 15px; font-family: inherit;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  input::placeholder { color: var(--dim); }
  input:focus { border-color: var(--accent); background: #2A2A32; }

  button {
    position: absolute; right: 7px; top: 7px;
    width: 34px; height: 34px;
    border: 0; border-radius: 50%;
    background: transparent; color: var(--dim);
    cursor: pointer; font-size: 15px;
  }
  button:hover { background: var(--tile-hover); color: var(--fg); }

  h2 {
    margin: 0 0 12px 4px;
    font-size: 11px; font-weight: 600;
    letter-spacing: 1.1px; text-transform: uppercase;
    color: var(--dim);
  }

  /* Built by the script below, so these start when the rows are inserted -- which is
     the same moment the rest of the page is being laid out. */
  section { margin-bottom: 34px;
            animation: rise .6s .3s cubic-bezier(.2,.8,.25,1) both; }
  section + section { animation-delay: .38s; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 10px;
  }

  .tile {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 9px; padding: 18px 8px;
    border-radius: 12px;
    background: var(--tile); color: var(--fg);
    text-decoration: none;
    transition: background .14s, transform .14s;
  }
  .tile:hover { background: var(--tile-hover); transform: translateY(-2px); }

  .icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: var(--fg);
    overflow: hidden;
  }

  /* The plate is only there to give a bare letter something to sit on. A real
     favicon already has its own shape, and putting it on a tinted square just
     reads as a box drawn around the icon. */
  .icon.letter {
    border-radius: 8px;
    background: #34343E;
  }

  .icon img {
    width: 28px; height: 28px;
    object-fit: contain;
  }

  .name {
    max-width: 100%;
    font-size: 12px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* The cross is two bars rather than a character or an icon.
     A '×' is positioned by the font, which aligns it to the math axis above the
     middle of the em box, so centring its line box still leaves the mark high. An
     SVG fixed that and left it half a pixel out, because a 9px mark centred in a
     20px circle has 11px to share between two sides.
     Two bars pinned to the centre and rotated about it have neither problem: the
     centre of each bar IS the centre of the button, whatever either of them
     measures, so it cannot drift by a fraction of a pixel or by a font. */
  .forget {
    position: absolute; top: 5px; right: 5px;
    width: 20px; height: 20px; border-radius: 50%;
    display: none;
    background: #3A3A45; color: var(--dim);
    border: 0; padding: 0; cursor: pointer;
  }
  .forget:hover { background: #4A4A57; color: var(--fg); }

  /* Three dots from one, using its own shadows for the outer two. The dot is pinned
     to the centre and the shadows are placed either side of it, so the group is
     centred by construction rather than by a measurement that has to come out even.
     The same reasoning as the cross this replaced, which took two attempts to centre
     as a character and then as an icon. */
  .forget::before {
    content: '';
    position: absolute; top: 50%; left: 50%;
    width: 2.5px; height: 2.5px; border-radius: 50%;
    background: currentColor;
    transform: translate(-50%, -50%);
    box-shadow: -4.5px 0 0 currentColor, 4.5px 0 0 currentColor;
  }

  /* The tile's own menu. Same surface as the chrome's context menus, because it is
     the same kind of thing and appears a few pixels from them. */
  #tilemenu {
    position: fixed; z-index: 5; display: none;
    min-width: 178px; padding: 5px;
    background: #1F1F26; border: 1px solid #3A3A45; border-radius: 9px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, .5);
  }
  #tilemenu.open { display: block; }

  #tilemenu button {
    position: static;
    display: block; width: 100%; height: auto;
    padding: 8px 10px; border: 0; border-radius: 6px;
    background: none; color: var(--fg);
    font-family: inherit; font-size: 12px; text-align: left;
    cursor: pointer;
  }
  #tilemenu button:hover { background: #33333C; color: var(--fg); }
  .tile:hover .forget { display: block; }

  /* Written after the hover rule on purpose: the two match with the same weight, so
     the later one is what a tile on its way out actually gets. */
  .tile.going {
    opacity: 0; transform: scale(.86); pointer-events: none;
    transition: opacity .16s ease-out, transform .16s ease-out;
  }
  .forget:hover { background: #4A4A57; color: var(--fg); }

  .empty { color: var(--dim); font-size: 13px; margin-left: 4px; }

  footer { margin-top: 40px; text-align: center;
           animation: rise .6s .46s cubic-bezier(.2,.8,.25,1) both; }
  footer a { color: var(--dim); font-size: 11px; text-decoration: none; }
  footer a:hover { color: var(--fg); }

  /* Separated by a dot drawn between them rather than by a character in the markup,
     so that either link disappearing does not leave a divider with one side. */
  footer a + a::before {
    content: '\00B7'; margin: 0 9px; color: #3A3A44;
  }

  /* --- History drawer ---------------------------------------------------
     Off-canvas rather than hidden: it is translated past the right edge and slid
     back, so opening and closing are the same movement in either direction and the
     list inside keeps its scroll position between visits. */
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 380px; max-width: 92vw;
    display: flex; flex-direction: column;
    background: #16161A;
    border-left: 1px solid #2A2A32;
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.3,.85,.3,1);
    z-index: 2;
  }
  #drawer.open { transform: none; }

  /* The handle rides on the drawer's own left edge, so it travels with it and the
     one control both opens and closes. */
  #handle {
    position: absolute; top: 50%; left: -26px;
    width: 26px; height: 64px;
    transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center;
    background: #16161A;
    border: 1px solid #2A2A32; border-right: 0;
    border-radius: 9px 0 0 9px;
    color: var(--dim); cursor: pointer;
    font-size: 12px; line-height: 1;
    transition: color .15s, background .15s;
  }
  #handle:hover { background: #1E1E25; color: var(--fg); }
  #handle span { transition: transform .28s cubic-bezier(.3,.85,.3,1); }
  #drawer.open #handle span { transform: rotate(180deg); }

  .drawer-head { padding: 16px 16px 12px; border-bottom: 1px solid #24242B; }
  .drawer-head h2 { margin: 0 0 11px 2px; }

  #find {
    width: 100%; height: 34px; padding: 0 12px;
    border: 1px solid transparent; border-radius: 8px;
    background: var(--field); color: var(--fg);
    font-size: 13px; font-family: inherit; outline: none;
  }
  #find:focus { border-color: var(--accent); }

  #entries { flex: 1; overflow-y: auto; padding: 8px 8px 14px; }

  /* Sticky so the day you are reading stays named while you scroll through it. */
  .day {
    position: sticky; top: 0;
    padding: 9px 8px 6px;
    background: #16161A;
    font-size: 11px; font-weight: 600; letter-spacing: 1.1px;
    text-transform: uppercase; color: var(--dim);
  }

  .entry {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px; border-radius: 8px;
    color: var(--fg); text-decoration: none;
  }
  .entry:hover { background: var(--tile); }
  .entry img, .entry .dot {
    width: 16px; height: 16px; flex: 0 0 16px; border-radius: 4px;
  }
  .entry .dot { background: #34343E; }
  .entry .text { min-width: 0; }
  .entry .t {
    font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .entry .h { font-size: 11px; color: var(--dim); }
  .entry .when { margin-left: auto; font-size: 11px; color: var(--dim); white-space: nowrap; }

  .drawer-foot {
    padding: 12px 16px 14px; border-top: 1px solid #24242B;
    display: flex; align-items: center; gap: 10px;
    font-size: 11.5px; color: var(--dim);
  }
  .drawer-foot select {
    background: var(--field); color: var(--fg); font-family: inherit; font-size: 11.5px;
    border: 1px solid #33333C; border-radius: 6px; padding: 4px 6px; outline: none;
  }
  #wipe {
    margin-left: auto; background: none; border: 0; padding: 4px 6px;
    position: static; width: auto; height: auto; border-radius: 6px;
    color: var(--dim); font-family: inherit; font-size: 11.5px; cursor: pointer;
  }
  #wipe:hover { background: var(--tile-hover); color: var(--fg); }

  /* Someone who has asked for less movement gets the page, not the arrival. The
     drawer still opens and closes; it simply stops sliding. */
  @media (prefers-reduced-motion: reduce) {
    .mark, h1, form, section, footer { animation: none; }
    .tile:hover { transform: none; }
    #drawer, #handle span { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="hero">
    <img id="mark" class="mark" src="__LUCENT_MARK__" alt="">
    <h1>Lucent</h1>
  </div>

  <form id="go" autocomplete="off">
    <!-- Deliberately not autofocused. A new tab puts the caret in the address bar
         instead, which is the box that completes from where you have been and the box
         that is there on every page rather than only on this one. Two boxes both
         asking for the keyboard is one of them winning at random. -->
    <input id="q" type="text" placeholder="Search Or Enter Address"
           spellcheck="false" aria-label="Search or enter address">
    <button type="submit" aria-label="Go">&#10132;</button>
  </form>

  <div id="rows"></div>

  <footer>
    <a id="default" href="/default">Make Lucent Your Default Browser</a>
    <a id="clear" href="/forget?all=1">Clear Most Visited</a>
  </footer>
</main>

<div id="tilemenu"></div>

<aside id="drawer">
  <div id="handle" role="button" tabindex="0" aria-label="History"><span>&#10094;</span></div>

  <div class="drawer-head">
    <h2>History</h2>
    <input id="find" type="text" placeholder="Search History"
           spellcheck="false" autocomplete="off" aria-label="Search history">
  </div>

  <div id="entries"></div>

  <div class="drawer-foot">
    <label for="keep">Keep For</label>
    <select id="keep">
      <option value="1">1 Day</option>
      <option value="7">1 Week</option>
      <option value="30">1 Month</option>
      <option value="90">3 Months</option>
      <option value="0">Forever</option>
    </select>
    <button id="wipe" type="button">Clear History</button>
  </div>
</aside>

<script>
// Injected by the host when the page is served. There is no host/page bridge in this
// browser -- web messaging and host objects are both switched off -- so the data
// arrives baked into the document rather than being requested from it.
var DATA = __LUCENT_DATA__;

// The host leaves the source empty if it could not read the logo. An <img> with no
// source draws as a broken tile, which is worse than showing no mark at all.
var mark = document.getElementById('mark');
if (!mark.getAttribute('src')) mark.remove();

// Mirrors Url.Normalize on the C# side: anything that looks like a host goes
// straight there, anything else is a search. Kept in step deliberately, so typing
// the same thing here and in the address bar does the same thing.
function destination(text) {
  var value = text.trim();
  if (!value) return null;

  if (/^(https?:\/\/|about:|edge:)/i.test(value)) return value;

  var looksLikeHost = value.indexOf(' ') === -1 &&
                      (value.indexOf('.') !== -1 || /^localhost(:\d+)?$/i.test(value));

  if (looksLikeHost) return 'https://' + value;

  return 'https://duckduckgo.com/?q=' + encodeURIComponent(value);
}

document.getElementById('go').addEventListener('submit', function (e) {
  e.preventDefault();
  var target = destination(document.getElementById('q').value);
  if (target) location.href = target;
});

function letter(site) {
  var source = site.title || site.host || '?';
  return source.replace(/^www\./i, '').charAt(0).toUpperCase();
}

function tile(site, kind) {
  var a = document.createElement('a');
  a.className = 'tile';
  a.href = site.url;
  a.title = site.host;

  var icon = document.createElement('span');
  if (site.icon) {
    icon.className = 'icon';
    var img = document.createElement('img');
    img.src = 'data:image/png;base64,' + site.icon;
    img.alt = '';
    icon.appendChild(img);
  } else {
    icon.className = 'icon letter';
    icon.textContent = letter(site);
  }

  var name = document.createElement('span');
  name.className = 'name';
  name.textContent = site.title || site.host;

  a.appendChild(icon);
  a.appendChild(name);

  // Carried on the tile rather than closed over, because the menu is one element
  // shared by every tile and has to be told which one opened it.
  a.dataset.kind = kind;
  a.dataset.host = site.host;
  a.dataset.url = site.url;

  var more = document.createElement('button');
  more.type = 'button';
  more.className = 'forget';
  more.title = 'Options';
  a.appendChild(more);

  return a;
}

function row(heading, sites, kind, emptyText) {
  var section = document.createElement('section');

  // Kept on the section because removing the last tile has to put this row back the
  // way an empty one is built, and by then the values that built it are long gone.
  section.dataset.kind = kind;
  section.dataset.empty = emptyText;

  var h2 = document.createElement('h2');
  h2.textContent = heading;
  section.appendChild(h2);

  if (!sites.length) {
    var note = document.createElement('div');
    note.className = 'empty';
    note.textContent = emptyText;
    section.appendChild(note);
    return section;
  }

  var grid = document.createElement('div');
  grid.className = 'tiles';
  sites.forEach(function (s) { grid.appendChild(tile(s, kind)); });
  section.appendChild(grid);

  return section;
}

var still = window.matchMedia('(prefers-reduced-motion: reduce)');

// --- Removing a tile ------------------------------------------------------
// Removing one used to navigate to /forget and come back as a freshly served page,
// which threw the whole start page away to delete a single tile: the mark re-animated,
// every row re-appeared, and anything open was closed. The row is edited in place
// instead.
//
// Layout does not animate. A tile leaving makes the ones after it occupy new slots
// immediately, and the only way to show that as movement is to measure where they
// were, put them back there with a transform, and then release them -- undoing the
// change so the browser can be watched making it.
function slide(grid, going) {
  var others = Array.prototype.filter.call(grid.children, function (el) {
    return el !== going;
  });

  var before = others.map(function (el) { return el.getBoundingClientRect(); });

  grid.removeChild(going);

  if (still.matches) return;

  var moved = [];

  others.forEach(function (el, i) {
    var now = el.getBoundingClientRect();
    var dx = before[i].left - now.left;
    var dy = before[i].top - now.top;
    if (!dx && !dy) return;

    el.style.transition = 'none';
    el.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
    moved.push(el);
  });

  if (!moved.length) return;

  // Read something back so the browser commits to the starting point. Without this
  // both transforms land in the same frame and there is nothing to animate between.
  void grid.offsetWidth;

  moved.forEach(function (el) {
    el.style.transition = 'transform .24s cubic-bezier(.3,.85,.3,1)';
    el.style.transform = '';
  });

  // Handed back to the stylesheet once it has arrived, or the inline transition would
  // outlive this and slow the hover down.
  setTimeout(function () {
    moved.forEach(function (el) { el.style.transition = ''; });
  }, 260);
}

function emptyOut(section) {
  var grid = section.querySelector('.tiles');
  if (grid) section.removeChild(grid);

  var note = document.createElement('div');
  note.className = 'empty';
  note.textContent = section.dataset.empty || '';
  section.appendChild(note);
}

function drop(tileEl, path) {
  var grid = tileEl.parentNode;
  var section = grid.parentNode;

  // Stops a second click landing on a tile that is already leaving.
  tileEl.classList.add('going');

  fetch(path, { cache: 'no-store' }).then(function () {
    window.setTimeout(function () {
      slide(grid, tileEl);

      if (!grid.children.length) emptyOut(section);
      if (section.dataset.kind === 'site' && !grid.children.length) hideClear();
    }, still.matches ? 0 : 170);
  });
}

// --- The tile menu --------------------------------------------------------
// One menu, moved to whichever tile asked for it. A menu per tile would be a hundred
// elements built to show at most one of them.
var tilemenu = document.getElementById('tilemenu');
var menuFor = null;

function closeMenu() {
  tilemenu.classList.remove('open');
  menuFor = null;
}

function item(label, run) {
  var button = document.createElement('button');
  button.type = 'button';
  button.textContent = label;
  button.addEventListener('click', function () {
    closeMenu();
    run();
  });
  return button;
}

function openMenu(tileEl, at) {
  tilemenu.textContent = '';
  menuFor = tileEl;

  var host = tileEl.dataset.host;
  var url = tileEl.dataset.url;

  if (tileEl.dataset.kind === 'bookmark') {
    tilemenu.appendChild(item('Remove Bookmark', function () {
      drop(tileEl, '/forget?bookmark=' + encodeURIComponent(url) + '&via=script');
    }));
  } else {
    tilemenu.appendChild(item('Remove', function () {
      drop(tileEl, '/forget?host=' + encodeURIComponent(host) + '&via=script');
    }));

    // Worth saying plainly which of the two this is. Remove lasts until the site is
    // visited again; this is the one that means it.
    tilemenu.appendChild(item('Never Show This Site', function () {
      drop(tileEl, '/hide?host=' + encodeURIComponent(host));
    }));
  }

  // Shown before being measured, since a hidden element has no size to place by.
  tilemenu.classList.add('open');

  var size = tilemenu.getBoundingClientRect();

  // Down and to the right of the pointer, the way every other menu in this browser
  // opens. Anchoring it to the button instead made it hang off to the left, which
  // read as a different kind of thing to the menus a page and a bookmark already
  // have.
  var left = at.x;
  var top = at.y;

  // Flipped back over the pointer rather than run off the edge, so a tile at the
  // right or the bottom of the grid still gets a whole menu.
  if (left + size.width > window.innerWidth - 8) left = at.x - size.width;
  if (top + size.height > window.innerHeight - 8) top = at.y - size.height;

  tilemenu.style.left = Math.max(8, left) + 'px';
  tilemenu.style.top = Math.max(8, top) + 'px';
}

var rows = document.getElementById('rows');

// Delegated, because the tiles are built and removed as the page is used and a
// listener on each one would have to be attached and forgotten along with it.
rows.addEventListener('click', function (e) {
  var button = e.target.closest ? e.target.closest('.forget') : null;
  if (!button) return;

  // The tile underneath is a link to the site. Without this, opening its menu would
  // navigate to the very thing the menu is about.
  e.preventDefault();
  e.stopPropagation();

  var tileEl = button.parentNode;

  if (menuFor === tileEl) {
    closeMenu();
    return;
  }

  // A click reports where the pointer was; a keyboard press reports nothing, and
  // detail is how the two are told apart. Falling back to the button's own corner
  // keeps the menu reachable without a mouse.
  var box = button.getBoundingClientRect();
  var at = e.detail === 0
    ? { x: box.left, y: box.bottom + 4 }
    : { x: e.clientX, y: e.clientY };

  openMenu(tileEl, at);
});

document.addEventListener('click', function (e) {
  if (!menuFor) return;
  if (tilemenu.contains(e.target)) return;
  if (e.target.closest && e.target.closest('.forget')) return;

  closeMenu();
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && menuFor) closeMenu();
});

window.addEventListener('resize', closeMenu);
rows.appendChild(row('Bookmarks', DATA.bookmarks, 'bookmark',
                     'Star a page to pin it here.'));
rows.appendChild(row('Most Visited', DATA.visited, 'site',
                     'Sites you visit will appear here.'));

function hideClear() { document.getElementById('clear').style.display = 'none'; }

if (!DATA.visited.length) hideClear();

// The way back to the offer in the chrome, which can be turned down for good. Only
// drawn while there is something to accept: a browser that is already the default
// saying so on every new tab is a line that never changes and never stops being read.
var makeDefault = document.getElementById('default');

if (DATA.isDefault) {
  makeDefault.remove();
} else {
  makeDefault.addEventListener('click', function (e) {
    e.preventDefault();

    // The host registers Lucent and opens the page in Settings where the choice is
    // actually made. Windows signs that choice itself, so this is as far as any
    // browser can take it -- and saying what happens next beats a link that looks
    // like it did nothing.
    fetch('/default', { cache: 'no-store' }).then(function () {
      makeDefault.textContent = 'Set Lucent For HTTP And HTTPS In Settings';
    });
  });
}

// Clearing the row goes the same way as removing one tile, for the same reason: a
// page that reloads to empty a list it has already emptied is doing the work twice
// and showing the seam.
document.getElementById('clear').addEventListener('click', function (e) {
  e.preventDefault();

  fetch('/forget?all=1&via=script', { cache: 'no-store' }).then(function () {
    var section = rows.querySelector('section[data-kind="site"]');
    if (!section) return;

    var grid = section.querySelector('.tiles');
    if (grid) {
      Array.prototype.forEach.call(grid.children, function (el) { el.classList.add('going'); });
    }

    window.setTimeout(function () {
      emptyOut(section);
      hideClear();
    }, still.matches ? 0 : 170);
  });
});

// --- History drawer -------------------------------------------------------
// Asked for when the drawer is first opened rather than handed over with the page:
// a history is far larger than a row of tiles and is usually never looked at, so
// baking it in would be paid for on every new tab. The request goes to this origin
// and is answered by the host, so nothing leaves the machine.
var drawer = document.getElementById('drawer');
var entries = document.getElementById('entries');
var find = document.getElementById('find');
var keep = document.getElementById('keep');

// Not "history": that name is already the browser's own on window, and assigning to
// it fails rather than shadowing it. Nor may anything below reuse a name from the
// tile code above -- function declarations are hoisted and the last one of a name
// wins, so a second row() would silently become the one the sections call.
var kept = null;

function ask(path) {
  return fetch(path, { cache: 'no-store' }).then(function (r) { return r.json(); });
}

function when(ms) {
  return new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

// Compared as local dates, not by dividing the timestamp: days are not all the same
// length, and an hour of daylight saving would file an evening under the wrong one.
function dayOf(ms) {
  var d = new Date(ms);
  var today = new Date();
  var yesterday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);

  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';

  return d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
}

function entryRow(item) {
  var a = document.createElement('a');
  a.className = 'entry';
  a.href = item.url;
  a.title = item.url;

  var icon = kept.icons[item.host];
  if (icon) {
    var img = document.createElement('img');
    img.src = 'data:image/png;base64,' + icon;
    img.alt = '';
    a.appendChild(img);
  } else {
    var dot = document.createElement('span');
    dot.className = 'dot';
    a.appendChild(dot);
  }

  var text = document.createElement('span');
  text.className = 'text';

  var title = document.createElement('div');
  title.className = 't';
  title.textContent = item.title || item.host;

  var host = document.createElement('div');
  host.className = 'h';
  host.textContent = item.host;

  text.appendChild(title);
  text.appendChild(host);
  a.appendChild(text);

  var stamp = document.createElement('span');
  stamp.className = 'when';
  stamp.textContent = when(item.at);
  a.appendChild(stamp);

  return a;
}

function draw() {
  entries.textContent = '';
  if (!kept) return;

  var needle = find.value.trim().toLowerCase();
  var shown = kept.entries.filter(function (item) {
    if (!needle) return true;
    return (item.title || '').toLowerCase().indexOf(needle) !== -1 ||
           (item.url || '').toLowerCase().indexOf(needle) !== -1;
  });

  if (!shown.length) {
    var none = document.createElement('div');
    none.className = 'empty';
    none.style.padding = '14px 10px';
    none.textContent = needle ? 'Nothing matches that.' : 'Nothing here yet.';
    entries.appendChild(none);
    return;
  }

  // The list arrives newest first, so a heading is needed only where the day
  // changes -- no grouping pass, and it stays in order for free.
  var last = null;
  shown.forEach(function (item) {
    var day = dayOf(item.at);
    if (day !== last) {
      var head = document.createElement('div');
      head.className = 'day';
      head.textContent = day;
      entries.appendChild(head);
      last = day;
    }
    entries.appendChild(entryRow(item));
  });
}

function load() {
  return ask('/history.json').then(function (data) {
    kept = data;
    keep.value = String(data.retentionDays);
    draw();
  });
}

function toggle() {
  var opening = !drawer.classList.contains('open');
  drawer.classList.toggle('open', opening);

  if (!opening) return;
  if (!kept) load().then(function () { find.focus(); });
  else find.focus();
}

document.getElementById('handle').addEventListener('click', toggle);
document.getElementById('handle').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
});

find.addEventListener('input', draw);

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && drawer.classList.contains('open')) toggle();
});

keep.addEventListener('change', function () {
  // Reloaded rather than filtered in place: shortening the window deletes entries,
  // and the list has to show what is actually kept rather than what was on screen.
  ask('/history/retention?days=' + encodeURIComponent(keep.value)).then(load);
});

document.getElementById('wipe').addEventListener('click', function () {
  ask('/history/clear').then(load);
});
</script>
</body>
</html>
