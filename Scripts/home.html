<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lucent</title>
<!-- The tab takes its icon from here like it would from any site, rather than the
     host reaching in to set one for its own page. Served as data: because that is
     all this page's policy below permits. -->
<link rel="icon" type="image/png" href="__LUCENT_ICON__">
<style>
  /* The chrome's palette, one step darker in the background. Matching the chrome
     exactly made the bookmarks bar bleed straight into the page, with nothing to
     say where the browser stopped and the page began -- a real site is a shade of
     its own, and this page should be too. */
  :root {
    --bg: #0B0B0E;
    --field: #26262D;
    --tile: #1D1D22;
    --tile-hover: #2C2C34;
    --fg: #E8E8EC;
    --dim: #8A8A95;
    --accent: #7C5CD6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body { display: flex; justify-content: center; }

  main { width: 100%; max-width: 720px; padding: 11vh 24px 60px; }

  /* The arrival. Everything comes in on the same short rise, staggered down the page
     so the eye is led from the mark to the search field instead of the whole layout
     appearing at once. Resting values live on the elements themselves and the
     animations only travel towards them, so switching the movement off leaves a
     correct page rather than an invisible one. */
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  /* The mark is a swirl, so it turns into place rather than merely fading. */
  @keyframes mark-in {
    from { opacity: 0; transform: translateY(14px) scale(.84) rotate(-14deg); }
    to   { opacity: 1; transform: none; }
  }

  /* One pass of the highlight across the wordmark as it lands, then it stays put. */
  @keyframes sheen {
    from { background-position: 0 0; }
    to   { background-position: 100% 0; }
  }

  /* Slow and shallow on purpose: this should read as the logo being lit, not as
     something on the page blinking for attention. */
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 3px 16px rgba(96, 132, 255, .20)); }
    50%      { filter: drop-shadow(0 3px 28px rgba(140, 116, 246, .34)); }
  }

  .hero { margin: 0 0 30px; text-align: center; }

  .mark {
    display: block; margin: 0 auto 15px;
    width: 84px; height: 84px;
    /* Follows the artwork's own alpha, so the glow traces the crescents rather
       than sitting behind a square. */
    filter: drop-shadow(0 3px 16px rgba(96, 132, 255, .20));
    animation: mark-in .7s cubic-bezier(.2,.9,.3,1) both,
               breathe 7s 1.1s ease-in-out infinite;
  }

  h1 {
    margin: 0;
    font-size: 34px; font-weight: 600; letter-spacing: -0.2px;
    /* Taken from the logo above it, so the name reads as part of the mark. The white
       stop is the highlight the sheen sweeps through; at rest the window sits past
       it, on the blue-to-violet end. */
    background-image: linear-gradient(100deg,
      #79CBFF 0%, #FFFFFF 22%, #8FB0FF 46%, #B48CF5 74%, #7C5CD6 100%);
    background-size: 220% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: rise .6s .1s cubic-bezier(.2,.8,.25,1) both,
               sheen 1.5s .3s cubic-bezier(.35,0,.2,1) both;
  }

  form { position: relative; margin: 0 0 46px;
         animation: rise .6s .2s cubic-bezier(.2,.8,.25,1) both; }

  input {
    width: 100%; height: 48px;
    padding: 0 46px 0 20px;
    border: 1px solid transparent; border-radius: 24px;
    background: var(--field); color: var(--fg);
    font-size: 15px; font-family: inherit;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  input::placeholder { color: var(--dim); }
  input:focus { border-color: var(--accent); background: #2A2A32; }

  button {
    position: absolute; right: 7px; top: 7px;
    width: 34px; height: 34px;
    border: 0; border-radius: 50%;
    background: transparent; color: var(--dim);
    cursor: pointer; font-size: 15px;
  }
  button:hover { background: var(--tile-hover); color: var(--fg); }

  h2 {
    margin: 0 0 12px 4px;
    font-size: 11px; font-weight: 600;
    letter-spacing: 1.1px; text-transform: uppercase;
    color: var(--dim);
  }

  /* Built by the script below, so these start when the rows are inserted -- which is
     the same moment the rest of the page is being laid out. */
  section { margin-bottom: 34px;
            animation: rise .6s .3s cubic-bezier(.2,.8,.25,1) both; }
  section + section { animation-delay: .38s; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 10px;
  }

  .tile {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 9px; padding: 18px 8px;
    border-radius: 12px;
    background: var(--tile); color: var(--fg);
    text-decoration: none;
    transition: background .14s, transform .14s;
  }
  .tile:hover { background: var(--tile-hover); transform: translateY(-2px); }

  .icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: var(--fg);
    overflow: hidden;
  }

  /* The plate is only there to give a bare letter something to sit on. A real
     favicon already has its own shape, and putting it on a tinted square just
     reads as a box drawn around the icon. */
  .icon.letter {
    border-radius: 8px;
    background: #34343E;
  }

  .icon img {
    width: 28px; height: 28px;
    object-fit: contain;
  }

  .name {
    max-width: 100%;
    font-size: 12px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Only offered on tiles the browser inferred. A bookmark is removed with its own
     star, and quietly having two ways to delete one would be worse than none. */
  .forget {
    position: absolute; top: 5px; right: 5px;
    width: 20px; height: 20px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    background: #3A3A45; color: var(--dim);
    font-size: 13px; line-height: 1; text-decoration: none;
  }
  .tile:hover .forget { display: flex; }
  .forget:hover { background: #4A4A57; color: var(--fg); }

  .empty { color: var(--dim); font-size: 13px; margin-left: 4px; }

  footer { margin-top: 40px; text-align: center;
           animation: rise .6s .46s cubic-bezier(.2,.8,.25,1) both; }
  footer a { color: var(--dim); font-size: 11px; text-decoration: none; }
  footer a:hover { color: var(--fg); }

  /* --- History drawer ---------------------------------------------------
     Off-canvas rather than hidden: it is translated past the right edge and slid
     back, so opening and closing are the same movement in either direction and the
     list inside keeps its scroll position between visits. */
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 380px; max-width: 92vw;
    display: flex; flex-direction: column;
    background: #16161A;
    border-left: 1px solid #2A2A32;
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.3,.85,.3,1);
    z-index: 2;
  }
  #drawer.open { transform: none; }

  /* The handle rides on the drawer's own left edge, so it travels with it and the
     one control both opens and closes. */
  #handle {
    position: absolute; top: 50%; left: -26px;
    width: 26px; height: 64px;
    transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center;
    background: #16161A;
    border: 1px solid #2A2A32; border-right: 0;
    border-radius: 9px 0 0 9px;
    color: var(--dim); cursor: pointer;
    font-size: 12px; line-height: 1;
    transition: color .15s, background .15s;
  }
  #handle:hover { background: #1E1E25; color: var(--fg); }
  #handle span { transition: transform .28s cubic-bezier(.3,.85,.3,1); }
  #drawer.open #handle span { transform: rotate(180deg); }

  .drawer-head { padding: 16px 16px 12px; border-bottom: 1px solid #24242B; }
  .drawer-head h2 { margin: 0 0 11px 2px; }

  #find {
    width: 100%; height: 34px; padding: 0 12px;
    border: 1px solid transparent; border-radius: 8px;
    background: var(--field); color: var(--fg);
    font-size: 13px; font-family: inherit; outline: none;
  }
  #find:focus { border-color: var(--accent); }

  #entries { flex: 1; overflow-y: auto; padding: 8px 8px 14px; }

  /* Sticky so the day you are reading stays named while you scroll through it. */
  .day {
    position: sticky; top: 0;
    padding: 9px 8px 6px;
    background: #16161A;
    font-size: 11px; font-weight: 600; letter-spacing: 1.1px;
    text-transform: uppercase; color: var(--dim);
  }

  .entry {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px; border-radius: 8px;
    color: var(--fg); text-decoration: none;
  }
  .entry:hover { background: var(--tile); }
  .entry img, .entry .dot {
    width: 16px; height: 16px; flex: 0 0 16px; border-radius: 4px;
  }
  .entry .dot { background: #34343E; }
  .entry .text { min-width: 0; }
  .entry .t {
    font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .entry .h { font-size: 11px; color: var(--dim); }
  .entry .when { margin-left: auto; font-size: 11px; color: var(--dim); white-space: nowrap; }

  .drawer-foot {
    padding: 12px 16px 14px; border-top: 1px solid #24242B;
    display: flex; align-items: center; gap: 10px;
    font-size: 11.5px; color: var(--dim);
  }
  .drawer-foot select {
    background: var(--field); color: var(--fg); font-family: inherit; font-size: 11.5px;
    border: 1px solid #33333C; border-radius: 6px; padding: 4px 6px; outline: none;
  }
  #wipe {
    margin-left: auto; background: none; border: 0; padding: 4px 6px;
    position: static; width: auto; height: auto; border-radius: 6px;
    color: var(--dim); font-family: inherit; font-size: 11.5px; cursor: pointer;
  }
  #wipe:hover { background: var(--tile-hover); color: var(--fg); }

  /* Someone who has asked for less movement gets the page, not the arrival. The
     drawer still opens and closes; it simply stops sliding. */
  @media (prefers-reduced-motion: reduce) {
    .mark, h1, form, section, footer { animation: none; }
    .tile:hover { transform: none; }
    #drawer, #handle span { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="hero">
    <img id="mark" class="mark" src="__LUCENT_MARK__" alt="">
    <h1>Lucent</h1>
  </div>

  <form id="go" autocomplete="off">
    <input id="q" type="text" placeholder="Search Or Enter Address" autofocus
           spellcheck="false" aria-label="Search or enter address">
    <button type="submit" aria-label="Go">&#10132;</button>
  </form>

  <div id="rows"></div>

  <footer><a id="clear" href="/forget?all=1">Clear Most Visited</a></footer>
</main>

<aside id="drawer">
  <div id="handle" role="button" tabindex="0" aria-label="History"><span>&#10094;</span></div>

  <div class="drawer-head">
    <h2>History</h2>
    <input id="find" type="text" placeholder="Search History"
           spellcheck="false" autocomplete="off" aria-label="Search history">
  </div>

  <div id="entries"></div>

  <div class="drawer-foot">
    <label for="keep">Keep For</label>
    <select id="keep">
      <option value="1">1 Day</option>
      <option value="7">1 Week</option>
      <option value="30">1 Month</option>
      <option value="90">3 Months</option>
      <option value="0">Forever</option>
    </select>
    <button id="wipe" type="button">Clear History</button>
  </div>
</aside>

<script>
// Injected by the host when the page is served. There is no host/page bridge in this
// browser -- web messaging and host objects are both switched off -- so the data
// arrives baked into the document rather than being requested from it.
var DATA = __LUCENT_DATA__;

// The host leaves the source empty if it could not read the logo. An <img> with no
// source draws as a broken tile, which is worse than showing no mark at all.
var mark = document.getElementById('mark');
if (!mark.getAttribute('src')) mark.remove();

// Mirrors Url.Normalize on the C# side: anything that looks like a host goes
// straight there, anything else is a search. Kept in step deliberately, so typing
// the same thing here and in the address bar does the same thing.
function destination(text) {
  var value = text.trim();
  if (!value) return null;

  if (/^(https?:\/\/|about:|edge:)/i.test(value)) return value;

  var looksLikeHost = value.indexOf(' ') === -1 &&
                      (value.indexOf('.') !== -1 || /^localhost(:\d+)?$/i.test(value));

  if (looksLikeHost) return 'https://' + value;

  return 'https://duckduckgo.com/?q=' + encodeURIComponent(value);
}

document.getElementById('go').addEventListener('submit', function (e) {
  e.preventDefault();
  var target = destination(document.getElementById('q').value);
  if (target) location.href = target;
});

function letter(site) {
  var source = site.title || site.host || '?';
  return source.replace(/^www\./i, '').charAt(0).toUpperCase();
}

function tile(site, removable) {
  var a = document.createElement('a');
  a.className = 'tile';
  a.href = site.url;
  a.title = site.host;

  var icon = document.createElement('span');
  if (site.icon) {
    icon.className = 'icon';
    var img = document.createElement('img');
    img.src = 'data:image/png;base64,' + site.icon;
    img.alt = '';
    icon.appendChild(img);
  } else {
    icon.className = 'icon letter';
    icon.textContent = letter(site);
  }

  var name = document.createElement('span');
  name.className = 'name';
  name.textContent = site.title || site.host;

  a.appendChild(icon);
  a.appendChild(name);

  if (removable) {
    var forget = document.createElement('a');
    forget.className = 'forget';
    forget.href = '/forget?host=' + encodeURIComponent(site.host);
    forget.textContent = '×';
    forget.title = 'Remove';
    a.appendChild(forget);
  }

  return a;
}

function row(heading, sites, removable, emptyText) {
  var section = document.createElement('section');

  var h2 = document.createElement('h2');
  h2.textContent = heading;
  section.appendChild(h2);

  if (!sites.length) {
    var note = document.createElement('div');
    note.className = 'empty';
    note.textContent = emptyText;
    section.appendChild(note);
    return section;
  }

  var grid = document.createElement('div');
  grid.className = 'tiles';
  sites.forEach(function (s) { grid.appendChild(tile(s, removable)); });
  section.appendChild(grid);

  return section;
}

var rows = document.getElementById('rows');
rows.appendChild(row('Bookmarks', DATA.bookmarks, false,
                     'Star a page to pin it here.'));
rows.appendChild(row('Most Visited', DATA.visited, true,
                     'Sites you visit will appear here.'));

if (!DATA.visited.length) document.getElementById('clear').style.display = 'none';

// --- History drawer -------------------------------------------------------
// Asked for when the drawer is first opened rather than handed over with the page:
// a history is far larger than a row of tiles and is usually never looked at, so
// baking it in would be paid for on every new tab. The request goes to this origin
// and is answered by the host, so nothing leaves the machine.
var drawer = document.getElementById('drawer');
var entries = document.getElementById('entries');
var find = document.getElementById('find');
var keep = document.getElementById('keep');

// Not "history": that name is already the browser's own on window, and assigning to
// it fails rather than shadowing it. Nor may anything below reuse a name from the
// tile code above -- function declarations are hoisted and the last one of a name
// wins, so a second row() would silently become the one the sections call.
var kept = null;

function ask(path) {
  return fetch(path, { cache: 'no-store' }).then(function (r) { return r.json(); });
}

function when(ms) {
  return new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

// Compared as local dates, not by dividing the timestamp: days are not all the same
// length, and an hour of daylight saving would file an evening under the wrong one.
function dayOf(ms) {
  var d = new Date(ms);
  var today = new Date();
  var yesterday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);

  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';

  return d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
}

function entryRow(item) {
  var a = document.createElement('a');
  a.className = 'entry';
  a.href = item.url;
  a.title = item.url;

  var icon = kept.icons[item.host];
  if (icon) {
    var img = document.createElement('img');
    img.src = 'data:image/png;base64,' + icon;
    img.alt = '';
    a.appendChild(img);
  } else {
    var dot = document.createElement('span');
    dot.className = 'dot';
    a.appendChild(dot);
  }

  var text = document.createElement('span');
  text.className = 'text';

  var title = document.createElement('div');
  title.className = 't';
  title.textContent = item.title || item.host;

  var host = document.createElement('div');
  host.className = 'h';
  host.textContent = item.host;

  text.appendChild(title);
  text.appendChild(host);
  a.appendChild(text);

  var stamp = document.createElement('span');
  stamp.className = 'when';
  stamp.textContent = when(item.at);
  a.appendChild(stamp);

  return a;
}

function draw() {
  entries.textContent = '';
  if (!kept) return;

  var needle = find.value.trim().toLowerCase();
  var shown = kept.entries.filter(function (item) {
    if (!needle) return true;
    return (item.title || '').toLowerCase().indexOf(needle) !== -1 ||
           (item.url || '').toLowerCase().indexOf(needle) !== -1;
  });

  if (!shown.length) {
    var none = document.createElement('div');
    none.className = 'empty';
    none.style.padding = '14px 10px';
    none.textContent = needle ? 'Nothing matches that.' : 'Nothing here yet.';
    entries.appendChild(none);
    return;
  }

  // The list arrives newest first, so a heading is needed only where the day
  // changes -- no grouping pass, and it stays in order for free.
  var last = null;
  shown.forEach(function (item) {
    var day = dayOf(item.at);
    if (day !== last) {
      var head = document.createElement('div');
      head.className = 'day';
      head.textContent = day;
      entries.appendChild(head);
      last = day;
    }
    entries.appendChild(entryRow(item));
  });
}

function load() {
  return ask('/history.json').then(function (data) {
    kept = data;
    keep.value = String(data.retentionDays);
    draw();
  });
}

function toggle() {
  var opening = !drawer.classList.contains('open');
  drawer.classList.toggle('open', opening);

  if (!opening) return;
  if (!kept) load().then(function () { find.focus(); });
  else find.focus();
}

document.getElementById('handle').addEventListener('click', toggle);
document.getElementById('handle').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
});

find.addEventListener('input', draw);

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && drawer.classList.contains('open')) toggle();
});

keep.addEventListener('change', function () {
  // Reloaded rather than filtered in place: shortening the window deletes entries,
  // and the list has to show what is actually kept rather than what was on screen.
  ask('/history/retention?days=' + encodeURIComponent(keep.value)).then(load);
});

document.getElementById('wipe').addEventListener('click', function () {
  ask('/history/clear').then(load);
});
</script>
</body>
</html>
